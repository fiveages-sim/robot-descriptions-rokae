# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    update_rate: 500  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    ocs2_arm_controller:
      type: ocs2_arm_controller/Ocs2ArmController

    # 左手夹爪控制器
    left_hand_controller:
      type: adaptive_gripper_controller/AdaptiveGripperController

    # 右手夹爪控制器
    right_hand_controller:
      type: adaptive_gripper_controller/AdaptiveGripperController

ocs2_arm_controller:
  ros__parameters:
    # Joint configuration
    update_rate: 500  # Hz
    joints:
      - left_joint1
      - left_joint2
      - left_joint3
      - left_joint4
      - left_joint5
      - left_joint6
      - left_joint7
      - right_joint1
      - right_joint2
      - right_joint3
      - right_joint4
      - right_joint5
      - right_joint6
      - right_joint7

    command_interfaces:
      - position
    state_interfaces:
      - position

    robot_name: ar5_ccs
    robot_type: dual

    # Future time offset for trajectory prediction (in seconds)
    future_time_offset: 1.0
    home_duration: 5.0
    home_interpolation_type: doubles
    movej_duration: 3.0
    movej_interpolation_type: doubles

    hold_position_threshold: 0.01
    hold_first_check_position_threshold: 0.1

    # Control parameters
    home_pos: [ 0.16, 1.32, -1.43, 1.1, -0.29, 0.49, -0.02,
               -0.16, 1.32,  1.43, 1.1,  0.29, 0.49,  0.02, ]
    rest_pos: [ 0.0, 1.5708, -1.5708, 0.4, -0.4, 0.4, 0.0,
                0.0, 1.5708, 1.5708, 0.4, 0.4, 0.4, 0.0 ]

# 左手夹爪控制器配置
left_hand_controller:
  ros__parameters:
    joint: left_gripper_joint
    use_effort_interface: false

# 右手夹爪控制器配置
right_hand_controller:
  ros__parameters:
    joint: right_gripper_joint
    use_effort_interface: false
